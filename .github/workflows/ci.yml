name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - atelier-v1
      - codex/chuka-approved-launch-20261003

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm test
        env:
          ALLOW_INDEXING: 'true'
      - run: npm run lint
      - run: npm run diff-check

  site-quality:
    name: site-quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Render indexable production candidate
        run: npm run build
        env:
          ALLOW_INDEXING: 'true'
      - name: Run page, indexability, internal-link and asset quality gates
        run: |
          node --test scripts/site-quality.test.mjs
          node scripts/check-site-quality.mjs
      - name: Block high/critical production and development dependency advisories
        run: npm audit --audit-level=high
      - run: npm run lint

  secret-scan:
    name: secret-scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - name: Scan repository history and PR changes for committed secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
