name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - atelier-v1
      - codex/chuka-approved-launch-20261003

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm test
        env:
          ALLOW_INDEXING: 'true'
      - run: npm run lint
      - run: npm run diff-check
