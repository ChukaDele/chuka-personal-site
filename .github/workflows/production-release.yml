name: Protected production release

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: "Exact approved 40-character main commit SHA"
        required: true
        type: string

permissions:
  contents: read
  checks: read

concurrency:
  group: chuka-personal-site-production
  cancel-in-progress: false

jobs:
  production-deploy:
    name: protected-production-deploy
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment:
      name: production
      url: https://chukadele.com
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify requested SHA is still the default branch head
        env:
          EXPECTED_SHA: ${{ inputs.release_sha }}
          WORKFLOW_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$EXPECTED_SHA" =~ ^[a-f0-9]{40}$ ]]; then
            echo "::error::Provide an exact reviewed 40-character Git SHA"
            exit 1
          fi
          if [[ "$EXPECTED_SHA" != "$WORKFLOW_SHA" ]] || [[ "$(git rev-parse HEAD)" != "$EXPECTED_SHA" ]]; then
            echo "::error::Reviewed release SHA does not match workflow and checkout"
            exit 1
          fi
          remote_main="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)"
          if [[ "$remote_main" != "$EXPECTED_SHA" ]]; then
            echo "::error::Default branch has changed since this release was approved"
            exit 1
          fi
          git switch -C main "$EXPECTED_SHA"

      - name: Verify all independently recorded required checks passed
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ inputs.release_sha }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/commits/$EXPECTED_SHA/check-runs?per_page=100" > "$RUNNER_TEMP/release-checks.json"
          for context in validate site-quality secret-scan; do
            if ! jq -e --arg n "$context" '([.check_runs[] | select(.name == $n and .app.id == 15368)] | sort_by(.started_at) | last | .conclusion) == "success"' "$RUNNER_TEMP/release-checks.json" > /dev/null; then
              echo "::error::Required GitHub Actions check $context is missing, pending or failed for $EXPECTED_SHA"
              exit 1
            fi
          done

      - name: Configure verified Node toolchain
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Install Chromium for release validation
        run: npx playwright install --with-deps chromium

      - name: Run all website quality checks on approved commit
        run: npm run qa:site
        env:
          CI: 'true'
          QA_DEPLOY_SHA: ${{ inputs.release_sha }}
          WRANGLER_LOG_PATH: ${{ runner.temp }}/release-qa-wrangler.log
          WRANGLER_REGISTRY_PATH: ${{ runner.temp }}/release-wrangler-registry
          MINIFLARE_REGISTRY_PATH: ${{ runner.temp }}/release-miniflare-registry

      - name: Build final indexable production assets before Cloudflare token access
        run: ALLOW_INDEXING=true npm run build

      - name: Verify Cloudflare Worker package without publishing
        shell: bash
        run: |
          ./node_modules/.bin/wrangler deploy --dry-run \
            --config wrangler.jsonc \
            --name chuka-personal-site \
            --var "DEPLOY_SHA:$(git rev-parse HEAD)" \
            --var "ALLOW_INDEXING:true"

      - name: Publish with production-scoped Cloudflare token
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          INDEXING_APPROVED_SHA: ${{ inputs.release_sha }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${CLOUDFLARE_API_TOKEN:-}" || -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]]; then
            echo "::error::A Cloudflare production API token and account ID must be configured in the protected production environment"
            exit 1
          fi
          if [[ "$(git rev-parse HEAD)" != "$INDEXING_APPROVED_SHA" ]] || [[ -n "$(git status --porcelain)" ]]; then
            echo "::error::Deployment source is dirty or mismatched"
            exit 1
          fi
          npm run deploy:enable-indexing

      - name: Verify the actual public site and deployed SHA
        env:
          EXPECTED_SHA: ${{ inputs.release_sha }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            if npm run qa:live-smoke -- --sha "$EXPECTED_SHA"; then
              echo "LIVE_SHA_VERIFIED=$EXPECTED_SHA" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "Release smoke attempt $attempt failed; waiting for CDN propagation"
            sleep 10
          done
          echo "::error::Production does not match reviewed release SHA after repeated checks"
          exit 1

      - name: Upload troubleshooting artifacts on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: production-release-failure-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/site-quality/
            ${{ runner.temp }}/release-qa-wrangler.log
          if-no-files-found: warn
          retention-days: 7
